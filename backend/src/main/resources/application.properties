spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/rapport_angi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.integrations.azo.url=${AZO_STATS_URL:}
app.integrations.azo.key=${AZO_STATS_API_KEY:}
app.integrations.zehami.url=${ZEHAMI_STATS_URL:}
app.integrations.zehami.key=${ZEHAMI_STATS_API_KEY:}

# SMTP pour les liens de réinitialisation (aucun email envoyé sans configuration).
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:}
app.public-url=${APP_PUBLIC_URL:http://localhost:4200}
spring.mail.properties.mail.smtp.ssl.enable=${SMTP_SSL:false}
app.bootstrap.reset-password=${BOOTSTRAP_ADMIN_RESET_PASSWORD:false}

# Exact frontend origins, separated by commas; no wildcard with session cookies.
app.allowed-origins=${APP_ALLOWED_ORIGINS:${app.public-url}}
