spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/rapport_angi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
server.port=${PORT:8080}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
app.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.integrations.azo.url=${AZO_STATS_URL:}
app.integrations.azo.key=${AZO_STATS_API_KEY:}
app.integrations.zehami.url=${ZEHAMI_STATS_URL:}
app.integrations.zehami.key=${ZEHAMI_STATS_API_KEY:}
